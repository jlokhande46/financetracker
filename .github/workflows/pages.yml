# Builds the PWA and publishes it to GitHub Pages.
#
# Requires Settings → Pages → Source: "GitHub Actions" to be selected once.
#
# BASE_PATH matters: a project site is served from
# https://<user>.github.io/<repo>/, so every absolute path in the build —
# assets, manifest, service-worker scope — has to be prefixed or the app 404s.
# Serving from a custom domain or a <user>.github.io repo instead? Set
# BASE_PATH to "/".
name: Deploy PWA to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# service worker is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Deploy only what passes. The build script runs the typecheck itself.
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages has no SPA rewrite. This app keeps its state in memory rather
      # than the URL so a deep link never happens in practice, but a refresh on
      # a stale path should still land in the app instead of a 404 page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
